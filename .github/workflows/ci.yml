name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  validate:
    name: ${{ matrix.name }} validation
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore locked dependencies
        run: dotnet restore TradingBot.sln --locked-mode

      - name: Build solution in Release
        id: build
        run: dotnet build TradingBot.sln --configuration Release --no-restore

      - name: Verify formatting
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet format TradingBot.sln --verify-no-changes --no-restore

      - name: Run complete cross-platform test suite
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          dotnet test TradingBot.sln
          --configuration Release
          --no-build
          --logger "trx"
          --results-directory artifacts/test-results

      - name: Build WPF natively on Windows
        if: ${{ !cancelled() && matrix.os == 'windows-latest' && steps.build.outcome == 'success' }}
        run: >-
          dotnet build src/Trading.UI.Wpf/Trading.UI.Wpf.csproj
          --configuration Release
          --no-restore

      - name: Publish deterministic WPF acceptance artifact
        if: ${{ !cancelled() && matrix.os == 'windows-latest' && steps.build.outcome == 'success' }}
        run: >-
          dotnet publish src/Trading.UI.Wpf/Trading.UI.Wpf.csproj
          --configuration Release
          --no-restore
          --output artifacts/wpf/win-x64

      - name: Run interactive WPF harness smoke
        if: ${{ !cancelled() && matrix.os == 'windows-latest' && steps.build.outcome == 'success' }}
        shell: pwsh
        env:
          LLM_TRADER_WPF_EXECUTABLE: ${{ github.workspace }}\artifacts\wpf\win-x64\Trading.UI.Wpf.exe
          LLM_TRADER_WPF_ARTIFACT_DIRECTORY: ${{ github.workspace }}\artifacts\wpf-test-results
        run: >-
          dotnet test tests/Trading.UI.Wpf.AcceptanceTests/Trading.UI.Wpf.AcceptanceTests.csproj
          --configuration Release
          --no-build
          -p:RunWpfAcceptance=true
          --filter TestCategory=HarnessSmoke
          --logger "trx;LogFileName=wpf-harness-smoke.trx"
          --results-directory artifacts/wpf-test-results

      - name: Publish test results and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.name }}
          path: |
            artifacts/test-results/**/*.trx
            artifacts/wpf-test-results/**
            **/TestResults/**
          if-no-files-found: warn
          retention-days: 14
